            - generic [ref=e204]: 400 年市場
            - heading "錦市場" [level=3] [ref=e205]
          - generic [ref=e206]:
            - paragraph [ref=e207]: 被稱為「京の台所」（京都的廚房）。390 公尺長的窄街，兩側 130 多家店，每家都非常專業——賣豆腐的只賣豆腐，賣醬菜的只賣醬菜。
            - paragraph [ref=e208]: 可以試吃、買小吃、找伴手禮。推薦玉子燒、川魚、京漬物。不喜歡魚腥的可以找和菓子。這裡是吃飽午餐之後慢慢逛的地方。
          - link "在 Google Maps 查看 →" [ref=e209] [cursor=pointer]:
            - /url: https://www.google.com/maps/search/錦市場+京都
        - generic [ref=e210]:
