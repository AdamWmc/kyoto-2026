            - paragraph [ref=e191]:
              - text: 旁邊有一支較小的「弁慶的錫杖」，讓參拜者試舉。
              - strong [ref=e192]: 可以安排成爸爸的試煉。
              - text: 這種互動小任務，讓景點不只是「看看就好」。
          - link "在 Google Maps 查看 →" [ref=e193] [cursor=pointer]:
