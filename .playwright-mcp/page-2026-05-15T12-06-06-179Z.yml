            - heading "清水寺" [level=3] [ref=e179]
          - generic [ref=e180]:
            - paragraph [ref=e181]: 建立於西元 778 年，現存本堂建於 1633 年（德川家光時代），懸在音羽山懸崖上，以 139 根大木柱支撐——沒有用一根釘子。
            - paragraph [ref=e182]: 日語諺語「清水の舞台から飛び降りる」（從清水舞台跳下去）相當於中文的背水一戰，用來形容下定決心做大事。你站上舞台時，腳下是四百年的歷史。
            - paragraph [ref=e183]: 音羽瀑布有三道水流：學問、戀愛、長壽，傳統上只能選一條喝——你選哪條，代表你最在乎什麼。
          - link "在 Google Maps 查看 →" [ref=e184] [cursor=pointer]:
            - /url: https://www.google.com/maps/search/清水寺+京都
