            - heading "鴨川納涼床" [level=3] [ref=e213]
          - generic [ref=e214]:
            - paragraph [ref=e215]: 江戶時代開始，京都人在鴨川旁搭起木製平台（「床」），每年 5 月到 9 月開放，稱為納涼床，是純正的京都夏日傳統。6 月底正好在開放季節。
            - paragraph [ref=e216]: 先斗町（ぽんとちょう）是最集中的區域，沿鴨川一排都是有床位的餐廳。夏夜坐在水邊，看鴨川流水和對岸的燈光，配上京料理或居酒屋料理。
            - paragraph [ref=e217]:
              - strong [ref=e218]: 建議提前 1-2 週訂位
              - text: ，選 18:30 入座，可以看到天色漸暗，感受白天到夜晚的轉換。
          - link "在 Google Maps 查看 →" [ref=e219] [cursor=pointer]:
            - /url: https://www.google.com/maps/search/先斗町+鴨川+京都
