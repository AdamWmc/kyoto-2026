            - generic [ref=e196]: 傳統街道
            - heading "三年坂 · 二年坂" [level=3] [ref=e197]
          - generic [ref=e198]:
            - paragraph [ref=e199]: 傳說在三年坂跌倒，壽命縮短三年；二年坂跌倒，縮短兩年。沒有人知道這個故事從哪裡來，但大家都走得特別小心。
            - paragraph [ref=e200]: 這條石板街是「重要傳統建造物群保存地區」，每一棟建築都受法律保護不得改建。兩旁是扇子、漆器、和菓子、抹茶冰淇淋，慢慢逛不用急。
