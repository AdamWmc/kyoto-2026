          - generic [ref=e111]: 花街 · 夜間
          - heading "祇園・花見小路" [level=3] [ref=e112]
        - generic [ref=e113]:
          - paragraph [ref=e114]: 祇園是江戶時代建立的「花街」——不只是藝伎文化，而是一整套圍繞宴席的美學體系：茶屋（ochaya）、舞妓、藝妓、懷石料理、酒宴、三味線。
          - paragraph [ref=e115]: 你在花見小路走的每一步，都曾經有武士、商人、文人走過。八坂神社是祇園的根，主祭祇園信仰，每年 7 月的祇園祭已連辦超過 1100 年。
          - paragraph [ref=e116]:
            - strong [ref=e117]: 為什麼選夜晚？
            - text: 白天遊客多，夜晚才看得到燈籠點亮、町家格子窗透出的溫暖光線——那是祇園真正的樣子。第一晚先跟導覽員建立脈絡，明天走東山才會更有感受。
        - link "在 Google Maps 查看 →" [ref=e118] [cursor=pointer]:
          - /url: https://www.google.com/maps/search/花見小路+祇園+京都
